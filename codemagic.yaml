# Codemagic builds for the iPhone app.
#
# The Android build does not live here. It is the Workflow Editor's
# "Default Workflow" in the Codemagic app live_darbar, because the upload
# keystore lives there. Each run builds the app bundle and publishes it to
# the Production track on Google Play, so each run is a release. Google Play
# takes its What's New from release_notes.json, and publishes only the
# languages that the store listing has.
#
# Both platforms build with the latest stable Flutter, obfuscate the Dart
# code, and keep the symbol files as artifacts. The symbols decode an
# obfuscated crash stack with `flutter symbolize`. They are not in the repo.
#
# The cache holds downloaded packages only, never build output. Each package
# version has its own folder and the lock files pick the version, so an
# update downloads the new version and nothing stale is used.
#
# No workflow has a trigger. A build starts only when Hark asks for it, from
# Codemagic or from its REST API, so a push never starts a build.
#
# - ios-check builds the iPhone app for release without signing. It needs no
#   Apple account, and shows that the app still compiles for a device.
# - ios-release signs the app, uploads it to App Store Connect, and submits
#   it to App Store review with the notes in ios/whats_new.txt. Apple
#   releases it to everyone as soon as it is approved. There is no TestFlight
#   step. It needs an active Apple Developer membership, and these in
#   Codemagic: the App Store Connect API key "Live Darbar", an Apple
#   Distribution certificate, and the App Store profile for
#   com.hsiharki.liveDarbar.

definitions:
  environment: &environment
    flutter: stable
    xcode: latest
    cocoapods: default
  cache: &cache
    cache_paths:
      - $HOME/.pub-cache
      - $HOME/Library/Caches/CocoaPods

workflows:
  ios-check:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *environment
    cache: *cache
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build the iPhone app for release, without signing
        script: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/symbols
    artifacts:
      - build/ios/iphoneos/Runner.app
      - build/symbols/*.symbols
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: iOS release to the App Store
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Live Darbar
    cache: *cache
    environment:
      <<: *environment
      # The app and its widget each need an App Store profile with the App
      # Group. These are the reference names of the signing files saved in
      # Codemagic (Settings > Code signing identities), not secrets. Named
      # here, so an older profile for the same bundle ID is never picked.
      ios_signing:
        provisioning_profiles:
          - live_darbar_app_store_v2
          - live_darbar_widget_app_store
        certificates:
          - live_darbar_distribution
      vars:
        # The app's Apple ID, from its App Store link (id6449766130).
        APP_STORE_APPLE_ID: 6449766130
    scripts:
      - name: Set up code signing on the Xcode project
        script: xcode-project use-profiles
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build the signed IPA
        script: |
          # The version name comes from pubspec.yaml. The build number is
          # the one in pubspec.yaml, or one more than the last uploaded build
          # when that is higher, so a second upload is never refused.
          PUBSPEC_BUILD=$(grep '^version:' pubspec.yaml | sed -E 's/^version: *[^+]+\+([0-9]+).*/\1/')
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$(( LATEST + 1 > PUBSPEC_BUILD ? LATEST + 1 : PUBSPEC_BUILD ))
          echo "Build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Upload, and submit to App Store review
        script: |
          # Waits until Apple has processed the build, then makes the App
          # Store version from pubspec.yaml, sets its What's New in the app's
          # primary language, and submits it for review. Apple releases it
          # as soon as it is approved, to everyone at once.
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -n 1)" \
            --app-store \
            --release-type AFTER_APPROVAL \
            --no-phased-release \
            --whats-new "$(cat ios/whats_new.txt)"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/*.symbols
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/Runner.xcarchive/dSYMs/*.dSYM
