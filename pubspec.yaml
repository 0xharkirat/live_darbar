name: live_darbar
description: "Live kirtan from Sri Darbar Sahib in Amritsar, wherever you are."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.1.0+11 #prev 3.0.0+10

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  flutter_riverpod: ^3.1.0
  rxdart: ^0.28.0
  quick_actions: ^1.0.8
  flutter_native_splash: ^2.4.3
  # Owns the media session: the notification, the lock screen, headset
  # buttons, and the browse tree that Android Auto and voice assistants read.
  # just_audio_background could not serve a browse tree, so it is gone.
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  url_launcher: ^6.3.1

  shared_preferences: ^2.3.4
  intl: any
  flutter_localizations:
    sdk: flutter
  intelligence: ^0.2.0
  path_provider: ^2.1.5
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^9.0.1
  # The home screen widget's shared store and its "draw again" call.
  home_widget: ^0.10.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  # The films in the "add the widget" sheet: muted, looped, no controls.
  # On Android it brings Media3 1.9.2 and just_audio brings 1.4.1: the app has
  # 1 copy of the library, and android/build.gradle names which.
  video_player: ^2.14.1
  wakelock_plus: ^1.5.2
  # The system share sheet, for "Share Live Darbar" and "Share this
  # Hukamnama". No tracking; the text goes only where the listener sends it.
  share_plus: ^12.0.0
  # The store's own rating sheet, asked for once a version after real use
  # (see lib/src/core/review_rules.dart), and the store page for the rate row.
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Lets a test move the clock forward, to check timers that fire every 15
  # minutes without waiting for them.
  fake_async: ^1.3.3

  # Lets a test stand in for the platform behind url_launcher, to check which
  # link opens and in which launch mode.
  url_launcher_platform_interface: ^2.3.2

  # Lets a test stand in for the platform behind video_player, to check that
  # the films are muted and looped, and when the audio session is touched.
  video_player_platform_interface: ^6.9.0
  plugin_platform_interface: ^2.1.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # The films in the steps sheet: an MP4 and a poster for each phone.
    - assets/videos/
    # The whole folder, not file by file: sgpc_sangrands.json, and one
    # sgpc_events_<year>.json for each Nanakshahi year. The app finds the
    # event files by name, so next March's file needs no change here.
    - assets/data/
    # One file for each release: whats_new/<major>.<minor>.json. The app finds
    # the file of the installed release by name, so the next release adds a
    # file and no code. See docs/DESIGN.md, "What's new".
    - assets/whats_new/

  # Bundled rather than fetched at runtime by google_fonts. That cost a
  # network round trip on first launch, a visible swap from the fallback
  # face, and on an offline first launch the intended face never arrived.
  #
  # Geist carries no Gurmukhi, so Punjabi would silently fall back to
  # whatever the OS supplied, and the app would render in two unrelated
  # typefaces. Noto Sans Gurmukhi is declared as the fallback family in
  # AppTheme, so each script gets a face chosen for it.
  #
  # Geist (Vercel, OFL, v1.9.0) is the sans of darbar.live. 3 static weights
  # (400, 500, 700), because 3 are used, each trimmed to Latin with pyftsubset
  # (about 56 KB). Nothing asks for 600.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-700.ttf
          weight: 700
    # CanvasKit, the web renderer, downloads Roboto from fonts.gstatic.com on
    # every load, as the face it falls back to, unless the app declares a
    # family with that name. This is Geist under the name Roboto: the request
    # goes away, and anything that ever lands on the fallback is set in the
    # app's own sans instead of a font the app never chose. Native apps never
    # ask for it.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
    - family: NotoSansGurmukhi
      fonts:
        - asset: assets/fonts/NotoSansGurmukhi-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGurmukhi-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGurmukhi-700.ttf
          weight: 700
    # Titles and Gurbani. Geist Serif (Vercel, OFL, v1.9.0 Regular) carries
    # Latin only, trimmed to Latin with pyftsubset (about 75 KB). Tiro
    # Gurmukhi (Tiro Typeworks, OFL, v1.52, from google/fonts ofl/tirogurmukhi,
    # "Copyright 2020 The Indigo Project Authors") sits behind it, so a title
    # is serif in either language. It is also the face of the Gurbani text.
    #
    # Both faces have 1 weight, 400, so nothing in the app asks them for
    # another. A 600 request would get a synthesized bold, which adds about
    # 15% ink and smears the strokes. Tiro is trimmed with pyftsubset to
    # Gurmukhi, the danda, and basic Latin, with hinting removed and all
    # layout features kept (about 65 KB).
    - family: GeistSerif
      fonts:
        - asset: assets/fonts/GeistSerif-400.ttf
          weight: 400
    - family: TiroGurmukhi
      fonts:
        - asset: assets/fonts/TiroGurmukhi-400.ttf
          weight: 400

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package



flutter_native_splash:
  # This package generates native code to customize Flutter's default white native splash screen
  # with background color and splash image.
  # Customize the parameters below, and run the following command in the terminal:
  # dart run flutter_native_splash:create
  # To restore Flutter's default white splash screen, run the following command in the terminal:
  # dart run flutter_native_splash:remove

  # IMPORTANT NOTE: These parameter do not affect the configuration of Android 12 and later, which
  # handle splash screens differently that prior versions of Android.  Android 12 and later must be
  # configured specifically in the android_12 section below.

  # color or background_image is the only required parameter.  Use color to set the background
  # of your splash screen to a solid color.  Use background_image to set the background of your
  # splash screen to a png image.  This is useful for gradients. The image will be stretch to the
  # size of the app. Only one parameter can be used, color and background_image cannot both be set.
  color: "#0c0a09"
  #background_image: "assets/background.png"

  # Optional parameters are listed below.  To enable a parameter, uncomment the line by removing
  # the leading # character.

  # The image parameter allows you to specify an image used in the splash screen.  It must be a
  # png file and should be sized for 4x pixel density.
  image: assets/images/splash.png

  # The branding property allows you to specify an image used as branding in the splash screen.
  # It must be a png file. It is supported for Android, iOS and the Web.  For Android 12,
  # see the Android 12 section below.
  #branding: assets/dart.png

  # To position the branding image at the bottom of the screen you can use bottom, bottomRight,
  # and bottomLeft. The default values is bottom if not specified or specified something else.
  #branding_mode: bottom
  
  # Set the branding padding from the bottom of the screen.  The default value is 0
  # branding_bottom_padding: 24

  # The color_dark, background_image_dark, image_dark, branding_dark are parameters that set the background
  # and image when the device is in dark mode. If they are not specified, the app will use the
  # parameters from above. If the image_dark parameter is specified, color_dark or
  # background_image_dark must be specified.  color_dark and background_image_dark cannot both be
  # set.
  #color_dark: "#042a49"
  #background_image_dark: "assets/dark-background.png"
  #image_dark: assets/splash-invert.png
  #branding_dark: assets/dart_dark.png

  # From Android 12 onwards, the splash screen is handled differently than in previous versions.
  # Please visit https://developer.android.com/guide/topics/ui/splash-screen
  # Following are specific parameters for Android 12+.
  android_12:
    # The image parameter sets the splash screen icon image.  If this parameter is not specified,
    # the app's launcher icon will be used instead.
    # Please note that the splash screen will be clipped to a circle on the center of the screen.
    # App icon with an icon background: This should be 960×960 pixels, and fit within a circle
    # 640 pixels in diameter.
    # App icon without an icon background: This should be 1152×1152 pixels, and fit within a circle
    # 768 pixels in diameter.  To fit a 1152x1152 image within a circle with a 768 diameter, simply 
    # ensure that the most important design elements of your image are placed within a circular area
    # with a 768 diameter at the center of the 1152x1152 canvas.
    image: assets/images/splash_logo.png

    # Splash screen background color.
    color: "#0c0a09"

    # App icon background color.
    #icon_background_color: "#111111"

    # The branding property allows you to specify an image used as branding in the splash screen.
    #branding: assets/dart.png

    # The image_dark, color_dark, icon_background_color_dark, and branding_dark set values that
    # apply when the device is in dark mode. If they are not specified, the app will use the
    # parameters from above.
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"

  # The android, ios and web parameters can be used to disable generating a splash screen on a given
  # platform.
  #android: false
  #ios: false
  #web: false

  # Platform specific images can be specified with the following parameters, which will override
  # the respective parameter.  You may specify all, selected, or none of these parameters:
  #color_android: "#42a5f5"
  #color_dark_android: "#042a49"
  #color_ios: "#42a5f5"
  #color_dark_ios: "#042a49"
  #color_web: "#42a5f5"
  #color_dark_web: "#042a49"
  #image_android: assets/splash-android.png
  #image_dark_android: assets/splash-invert-android.png
  #image_ios: assets/splash-ios.png
  #image_dark_ios: assets/splash-invert-ios.png
  #image_web: assets/splash-web.gif
  #image_dark_web: assets/splash-invert-web.gif
  #background_image_android: "assets/background-android.png"
  #background_image_dark_android: "assets/dark-background-android.png"
  #background_image_ios: "assets/background-ios.png"
  #background_image_dark_ios: "assets/dark-background-ios.png"
  #background_image_web: "assets/background-web.png"
  #background_image_dark_web: "assets/dark-background-web.png"
  #branding_android: assets/brand-android.png
  #branding_bottom_padding_android: 24
  #branding_dark_android: assets/dart_dark-android.png
  #branding_ios: assets/brand-ios.png
  #branding_bottom_padding_ios: 24
  #branding_dark_ios: assets/dart_dark-ios.png
  #branding_web: assets/brand-web.gif
  #branding_dark_web: assets/dart_dark-web.gif

  # The position of the splash image can be set with android_gravity, ios_content_mode, and
  # web_image_mode parameters.  All default to center.
  #
  # android_gravity can be one of the following Android Gravity (see
  # https://developer.android.com/reference/android/view/Gravity): bottom, center,
  # center_horizontal, center_vertical, clip_horizontal, clip_vertical, end, fill, fill_horizontal,
  # fill_vertical, left, right, start, or top.
  #android_gravity: center
  #
  # ios_content_mode can be one of the following iOS UIView.ContentMode (see
  # https://developer.apple.com/documentation/uikit/uiview/contentmode): scaleToFill,
  # scaleAspectFit, scaleAspectFill, center, top, bottom, left, right, topLeft, topRight,
  # bottomLeft, or bottomRight.
  #ios_content_mode: center
  #
  # web_image_mode can be one of the following modes: center, contain, stretch, and cover.
  #web_image_mode: center

  # The screen orientation can be set in Android with the android_screen_orientation parameter.
  # Valid parameters can be found here:
  # https://developer.android.com/guide/topics/manifest/activity-element#screen
  #android_screen_orientation: sensorLandscape

  # To hide the notification bar, use the fullscreen parameter.  Has no effect in web since web
  # has no notification bar.  Defaults to false.
  # NOTE: Unlike Android, iOS will not automatically show the notification bar when the app loads.
  #       To show the notification bar, add the following code to your Flutter app:
  #       WidgetsFlutterBinding.ensureInitialized();
  #       SystemChrome.setEnabledSystemUIMode(SystemUiMode.manual, overlays: [SystemUiOverlay.bottom, SystemUiOverlay.top], );
  #fullscreen: true

  # If you have changed the name(s) of your info.plist file(s), you can specify the filename(s)
  # with the info_plist_files parameter.  Remove only the # characters in the three lines below,
  # do not remove any spaces:
  #info_plist_files:
  #  - 'ios/Runner/Info-Debug.plist'
  #  - 'ios/Runner/Info-Release.plist'
